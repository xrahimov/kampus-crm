# Production stack for one server (docs/DEPLOY.md): PostgreSQL, migrations and
# first-start bootstrap, the web app, the job worker, Caddy for HTTPS, a TURN
# relay for video lessons and a nightly database dump. Settings come from .env
# (see .env.production.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build

name: kampus

x-database-url: &database-url postgresql://kampus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kampus?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kampus
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies migrations on every start and creates the organisation and the
  # first CEO account on the first start only (scripts/bootstrap.ts).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-}
      BOOTSTRAP_BRANCH_NAME: ${BOOTSTRAP_BRANCH_NAME:-}
      BOOTSTRAP_CEO_NAME: ${BOOTSTRAP_CEO_NAME:-}
      BOOTSTRAP_CEO_PHONE: ${BOOTSTRAP_CEO_PHONE:-}
      BOOTSTRAP_CEO_PASSWORD: ${BOOTSTRAP_CEO_PASSWORD:-}
      BOOTSTRAP_CASH_NAME: ${BOOTSTRAP_CASH_NAME:-}
    command: sh -c "npx prisma migrate deploy && npx tsx scripts/bootstrap.ts"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:?set APP_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /data/uploads
      # The relay below, used unless Settings → Integrations → Video lessons names another.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:?set APP_URL in .env}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # TURN relay for video lessons (coturn): browsers that cannot reach each other
  # directly (mobile networks, strict NAT, office firewalls) send their media
  # through it. Host networking, because the relay hands out UDP ports.
  # Credentials are short-lived HMACs of TURN_SECRET (coturn use-auth-secret).
  # Open 3478/tcp, 3478/udp and 49160-49200/udp in the firewall.
  turn:
    image: coturn/coturn:4
    restart: unless-stopped
    network_mode: host
    command: >
      --listening-port=3478
      --external-ip=${TURN_PUBLIC_IP:?set TURN_PUBLIC_IP in .env}
      --realm=${DOMAIN:-kampus}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      --min-port=49160
      --max-port=49200
      --fingerprint
      --no-tls
      --no-cli
      --no-multicast-peers
      --log-file=stdout
      --simple-log

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: kampus
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: kampus
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      # Uploaded files and lesson recordings, mirrored into ./backups/uploads.
      - uploads:/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
