name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      DATABASE_URL: postgresql://kampus:kampus@localhost:5432/kampus?schema=public
      APP_URL: http://localhost:3000
      SEED_ADMIN_PHONE: "+998900000001"
      SEED_ADMIN_PASSWORD: "Kampus!2026"
      NEXT_TELEMETRY_DISABLED: "1"
      # Test-only stand-in for Telegram's login server (A-150); never set on a real server.
      TELEGRAM_LOGIN_FAKE: "1"

    steps:
      - uses: actions/checkout@v4

      # Docker Hub rate-limits anonymous image pulls from shared runners, so the
      # database is the PostgreSQL 16 that ships preinstalled on ubuntu-latest.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          for i in $(seq 1 30); do sudo -u postgres pg_isready -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER kampus WITH PASSWORD 'kampus' SUPERUSER;" \
            -c "CREATE DATABASE kampus OWNER kampus;"
          pg_isready -h localhost -p 5432 -U kampus -d kampus

      # A Caddyfile that does not parse takes the whole site down at the next
      # update, so it is checked here as the server would load it: as shipped,
      # and after a move with one and with two former names (A-202). The binary
      # comes from Caddy's own releases; Docker Hub pulls are rate-limited here.
      - name: Caddy configuration is valid
        run: |
          curl -fsSL -o /tmp/caddy.tgz https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz
          tar -xzf /tmp/caddy.tgz -C /tmp caddy
          DOMAIN=crm.example.uz /tmp/caddy validate --config docker/Caddyfile --adapter caddyfile
          DOMAIN=crm.example.uz FORMER_DOMAIN=http://former-address.invalid /tmp/caddy validate --config docker/Caddyfile --adapter caddyfile
          DOMAIN=crm.example.uz FORMER_DOMAIN=old.example.uz /tmp/caddy validate --config docker/Caddyfile --adapter caddyfile
          DOMAIN=crm.example.uz FORMER_DOMAIN="old.example.uz, www.example.uz" /tmp/caddy validate --config docker/Caddyfile --adapter caddyfile
          DOMAIN=:80 /tmp/caddy validate --config docker/Caddyfile --adapter caddyfile
          DOMAIN=crm.example.uz FORMER_DOMAIN="old.example.uz, www.example.uz" /tmp/caddy adapt --config docker/Caddyfile --adapter caddyfile > /tmp/caddy.json
          grep -q '"old.example.uz"' /tmp/caddy.json && grep -q '"www.example.uz"' /tmp/caddy.json
          grep -q 'https://crm.example.uz{http.request.uri}' /tmp/caddy.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
