name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kampus
          POSTGRES_PASSWORD: kampus
          POSTGRES_DB: kampus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kampus -d kampus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CI: "true"
      DATABASE_URL: postgresql://kampus:kampus@localhost:5432/kampus?schema=public
      APP_URL: http://localhost:3000
      SEED_ADMIN_PHONE: "+998900000001"
      SEED_ADMIN_PASSWORD: "Kampus!2026"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
