name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      DATABASE_URL: postgresql://kampus:kampus@localhost:5432/kampus?schema=public
      APP_URL: http://localhost:3000
      SEED_ADMIN_PHONE: "+998900000001"
      SEED_ADMIN_PASSWORD: "Kampus!2026"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Docker Hub rate-limits anonymous image pulls from shared runners, so the
      # database is the PostgreSQL 16 that ships preinstalled on ubuntu-latest.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          for i in $(seq 1 30); do sudo -u postgres pg_isready -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER kampus WITH PASSWORD 'kampus' SUPERUSER;" \
            -c "CREATE DATABASE kampus OWNER kampus;"
          pg_isready -h localhost -p 5432 -U kampus -d kampus

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
